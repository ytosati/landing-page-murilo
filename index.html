<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo de Descontos em Relógios</title>
  <meta name="description" content="Entre no grupo de descontos e receba promoções exclusivas de relógios no WhatsApp.">
  <meta name="theme-color" content="#2b2d31">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Ao alterar style.css ou script.js, aumente o ?v= para o navegador baixar a versão nova -->
  <link rel="stylesheet" href="style.css?v=3">

  <script>
    /* =========================================================
       CONFIGURAÇÃO — edite apenas estes dois valores
       ========================================================= */
    window.SITE_CONFIG = {
      PIXEL_ID: '1482791613643958',          // ID do Meta Pixel (só números)
      WHATSAPP_GROUP_URL: 'LINK_DO_GRUPO'    // https://chat.whatsapp.com/...
    };
    /* ========================================================= */

    // Meta Pixel — código base. Só carrega quando o PIXEL_ID real estiver preenchido.
    (function (config) {
      if (!/^\d+$/.test(config.PIXEL_ID)) {
        console.info('[Pixel] PIXEL_ID ainda não configurado. Pixel desativado.');
        return;
      }
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', config.PIXEL_ID);
      fbq('track', 'PageView');
    })(window.SITE_CONFIG);
  </script>
  <!-- Fallback sem JavaScript: se trocar o PIXEL_ID acima, troque aqui também -->
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=1482791613643958&ev=PageView&noscript=1"></noscript>

  <script src="script.js?v=3" defer></script>
</head>
<body>
  <!-- Fundo decorativo com os logos das marcas (preenchido pelo script.js) -->
  <div class="brand-wall" id="brand-wall" aria-hidden="true"></div>

  <main class="hero">
    <div class="mascot" id="mascot" aria-hidden="true"></div>

    <section class="card">
      <h1 class="card__title">Promoções exclusivas de relógios</h1>
      <p class="card__text">Ofertas e lançamentos das melhores marcas, antes de todo mundo, direto no seu WhatsApp.</p>

      <a class="cta" id="whatsapp-cta" href="#" target="_blank" rel="noopener">
        <img class="cta__icon" src="assets/whatsapp.svg" alt="" width="24" height="24">
        Entrar no grupo de descontos
      </a>

      <p class="card__note">Gratuito</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> Todos os direitos reservados.</p>
  </footer>
</body>
</html>
